name: Build and Push Image
on:
  push:
  schedule:
    - cron: '0 0 * * 2,5'
  workflow_dispatch:
jobs:
  check-build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_build: ${{ steps.guard.outputs.should_build }}
    steps:
      - name: Check whether a build is needed
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          should_build = True
          now = datetime.now(timezone.utc)

          if os.environ["EVENT_NAME"] == "push":
              branch = os.environ["BRANCH"]

              if branch == os.environ["DEFAULT_BRANCH"]:
                  next_24_hours = now + timedelta(hours=24)
                  next_scheduled_build = False
                  for offset in range(8):
                      scheduled_at = (now + timedelta(days=offset)).replace(
                          hour=0, minute=0, second=0, microsecond=0
                      )
                      if (
                          scheduled_at.weekday() in (1, 4)
                          and now < scheduled_at <= next_24_hours
                      ):
                          next_scheduled_build = True
                          break

                  if next_scheduled_build:
                      print("Skipping push build: a scheduled build is due within 24 hours.")
                      should_build = False

              if should_build:
                  query = urllib.parse.urlencode({
                      "branch": branch,
                      "status": "success",
                      "per_page": "100",
                  })
                  url = (
                      f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
                      f"/actions/workflows/build-image.yml/runs?{query}"
                  )
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  with urllib.request.urlopen(request) as response:
                      runs = json.load(response)["workflow_runs"]

                  cutoff = now - timedelta(hours=24)
                  recent_success = any(
                      run["conclusion"] == "success"
                      and run["completed_at"] is not None
                      and datetime.fromisoformat(
                          run["completed_at"].replace("Z", "+00:00")
                      ) >= cutoff
                      for run in runs
                  )

                  if recent_success:
                      print("Skipping push build: this branch built successfully within the past 24 hours.")
                      should_build = False

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"should_build={str(should_build).lower()}\n")
          PY
  build:
    needs: check-build
    if: needs.check-build.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push image
        run: |
          IMAGE_TAG="ghcr.io/${{ github.repository }}:latest"
          podman build --pull=newer -t "$IMAGE_TAG" -f ./Containerfile .
          podman push "$IMAGE_TAG"
